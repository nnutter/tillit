<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-gitGraph" viewBox="0 0 320 111" width="320" height="111" style="max-width:100%;height:auto;color:#1f1f1f;font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="gitGraph" aria-labelledby="git-after-first-rebase-title" aria-describedby="git-after-first-rebase-desc"><rect width="320" height="111" fill="#ffffff"/><title id="git-after-first-rebase-title">After the first rebase, the user commits D</title><desc id="git-after-first-rebase-desc">spor rebase brings the validated commits A, A!, and B onto the user branch. The user commits D on top of B. C and C! stay on the spor branch because C! has not passed yet.</desc><g transform="translate(71.23,20.5)"><g class="pele-branches" fill="none" font-size="14"><g class="pele-branch" data-id="user"><path class="pele-lane" d="M-20,0L240,0" stroke="#4c78a8" stroke-dasharray="2 4"/><rect x="-63.23" y="-12.5" width="43.23" height="25" fill="#4c78a8" rx="4"/><text class="pele-label" fill="#ffffff" x="-41.61" y="4.9" text-anchor="middle">user</text></g><g class="pele-branch" data-id="spor"><path class="pele-lane" d="M-20,51.25L240,51.25" stroke="#f58518" stroke-dasharray="2 4"/><rect x="-63.23" y="38.75" width="43.23" height="25" fill="#f58518" rx="4"/><text class="pele-label" fill="#ffffff" x="-41.61" y="56.15" text-anchor="middle">spor</text></g></g><g class="pele-edges" fill="none" stroke-width="2" stroke-linecap="round"><path class="pele-edge" d="M88,0C106,0 106,51.25 124,51.25L132,51.25" stroke="#f58518"/><path class="pele-edge" d="M0,0L44,0" stroke="#4c78a8"/><path class="pele-edge" d="M44,0L88,0" stroke="#4c78a8"/><path class="pele-edge" d="M132,51.25L176,51.25" stroke="#f58518"/><path class="pele-edge" d="M88,0L220,0" stroke="#4c78a8"/></g><g class="pele-commits" font-size="12" fill="#6e6e6e"><g class="pele-commit pele-commit-normal" data-id="A"><circle cx="0" cy="0" r="7" fill="#4c78a8"/><g class="pele-commit-label" transform="rotate(-45 3 16.36)"><rect x="-7" y="9.36" width="12" height="14" rx="3" fill="#ffffff"/><text x="-1" y="20.56" text-anchor="middle">A</text></g></g><g class="pele-commit pele-commit-normal" data-id="A!"><circle cx="44" cy="0" r="7" fill="#4c78a8"/><g class="pele-commit-label" transform="rotate(-45 47 16.36)"><rect x="33.66" y="9.36" width="15.34" height="14" rx="3" fill="#ffffff"/><text x="41.33" y="20.56" text-anchor="middle">A!</text></g></g><g class="pele-commit pele-commit-normal" data-id="B"><circle cx="88" cy="0" r="7" fill="#4c78a8"/><g class="pele-commit-label" transform="rotate(-45 91 16.36)"><rect x="81" y="9.36" width="12" height="14" rx="3" fill="#ffffff"/><text x="87" y="20.56" text-anchor="middle">B</text></g></g><g class="pele-commit pele-commit-normal" data-id="C"><circle cx="132" cy="51.25" r="7" fill="#f58518"/><g class="pele-commit-label" transform="rotate(-45 135 67.61)"><rect x="124.34" y="60.61" width="12.66" height="14" rx="3" fill="#ffffff"/><text x="130.67" y="71.81" text-anchor="middle">C</text></g></g><g class="pele-commit pele-commit-normal" data-id="C!"><circle cx="176" cy="51.25" r="7" fill="#f58518"/><g class="pele-commit-label" transform="rotate(-45 179 67.61)"><rect x="165" y="60.61" width="16" height="14" rx="3" fill="#ffffff"/><text x="173" y="71.81" text-anchor="middle">C!</text></g></g><g class="pele-commit pele-commit-normal" data-id="D"><circle cx="220" cy="0" r="7" fill="#4c78a8"/><g class="pele-commit-label" transform="rotate(-45 223 16.36)"><rect x="212.34" y="9.36" width="12.66" height="14" rx="3" fill="#ffffff"/><text x="218.67" y="20.56" text-anchor="middle">D</text></g></g></g></g></svg>
